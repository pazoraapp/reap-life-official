<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Reset Password | REAP LIFE</title>

  <link rel="stylesheet" href="./assets/reap-v2.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: #f9fafb;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .reset-card {
      width: 100%;
      max-width: 440px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 18px;
      padding: 28px;
      box-sizing: border-box;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .logo {
      display: block;
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin: 0 auto 16px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 0 0 10px;
    }

    .intro {
      color: #d1d5db;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #4b5563;
      background: #111827;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #d6b36a;
      color: #111827;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.error {
      display: block;
      background: #7f1d1d;
      color: white;
    }

    #message.success {
      display: block;
      background: #14532d;
      color: white;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #f3d38b;
      text-decoration: none;
    }

    .small {
      font-size: 13px;
      color: #d1d5db;
      line-height: 1.6;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <img
      class="logo"
      src="./reap-life-logo.png"
      alt="REAP LIFE logo"
      onerror="this.style.display='none'"
    >

    <h1>Create a New Password</h1>

    <p class="intro">
      Enter your new password below to regain access to your REAP LIFE account.
    </p>

    <div id="form-area" hidden>
      <form id="reset-form">
        <label for="password">New password</label>
        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="At least 8 characters"
          required
        >

        <label for="confirm-password">Confirm new password</label>
        <input
          id="confirm-password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Enter the password again"
          required
        >

        <button id="submit-button" type="submit">
          Update Password
        </button>
      </form>
    </div>

    <div id="message" role="status" aria-live="polite"></div>

    <a class="back" href="./auth.html">Return to Sign In</a>

    <p class="small">
      For your security, choose a password you do not use on other websites.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/reap-config.js"></script>
  <script src="./assets/reap-supabase.js"></script>

  <script>
    const formArea = document.getElementById('form-area');
    const form = document.getElementById('reset-form');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm-password');
    const button = document.getElementById('submit-button');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    async function initialiseResetPage() {
      try {
        if (!window.REAP_AUTH || !REAP_AUTH.configured()) {
          showMessage(
            'Account authentication is not configured. Please contact the REAP LIFE administrator.',
            'error'
          );
          return;
        }

        const client = REAP_AUTH.client();

        const hash = window.location.hash;
        const params = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(hash.replace(/^#/, ''));

        const errorCode =
          params.get('error_code') ||
          hashParams.get('error_code');

        const errorDescription =
          params.get('error_description') ||
          hashParams.get('error_description');

        if (errorCode || errorDescription) {
          showMessage(
            'This password-reset link is invalid or has expired. Please return to Sign In and request another reset email.',
            'error'
          );
          return;
        }

        if (hashParams.get('type') === 'recovery') {
          const accessToken = hashParams.get('access_token');
          const refreshToken = hashParams.get('refresh_token');

          if (accessToken && refreshToken) {
            const result = await client.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });

            if (result.error) throw result.error;
          }
        }

        const result = await client.auth.getSession();

        if (result.error) throw result.error;

        if (!result.data.session) {
          showMessage(
            'We could not verify this reset link. It may have expired or already been used. Please return to Sign In and request a new password-reset email.',
            'error'
          );
          return;
        }

        formArea.hidden = false;
        showMessage(
          'Your reset link is verified. You can now choose a new password.',
          'success'
        );
      } catch (error) {
        showMessage(
          error.message || 'Unable to verify the reset link. Please request a new one.',
          'error'
        );
      }
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      const password = passwordInput.value;
      const confirmation = confirmInput.value;

      if (password.length < 8) {
        showMessage('Your password must contain at least 8 characters.', 'error');
        return;
      }

      if (password !== confirmation) {
        showMessage('The two passwords do not match. Please try again.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating password…';

      try {
        const client = REAP_AUTH.client();
        const result = await client.auth.updateUser({
          password: password
        });

        if (result.error) throw result.error;

        formArea.hidden = true;
        passwordInput.value = '';
        confirmInput.value = '';

        showMessage(
          'Your password has been changed successfully. You can now return to Sign In and log in with your new password.',
          'success'
        );
      } catch (error) {
        showMessage(
          error.message || 'We could not update your password. Please try again.',
          'error'
        );
      } finally {
        button.disabled = false;
        button.textContent = 'Update Password';
      }
    });

    initialiseResetPage();
  </script>
</body>
</html>
