<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAP LIFE — Player</title><style>body{margin:0;background:#f8f5ed;color:#24352d;font-family:system-ui}.wrap{max-width:850px;margin:auto;padding:20px 16px}.card{background:#fff;border:1px solid #e5dfd3;border-radius:18px;padding:20px;margin-top:14px}a{color:#245b45}.note{color:#68766f;line-height:1.6}audio,video{width:100%;margin-top:14px}</style></head><body><main class="wrap"><a href="./index.html">← REAP LIFE</a><div id="app" class="card"><h1>▶ REAP LIFE Player</h1><p class="note">Loading player…</p></div></main><script>
const app=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
fetch('./library.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('library');return r.json()}).then(d=>{const x=(d.content||[]).find(a=>a.id==='RL-0001'),u=x?.media?.audioUrl||'';app.innerHTML='<h1>▶ REAP LIFE Player</h1><h2>'+esc(x?.title||'REAP LIFE Message')+'</h2>'+(u?'<audio controls preload="metadata" src="'+esc(u)+'"></audio>':'<p class="note">The player is working. No audio file has been attached yet.</p>')+'<p><a href="./audio.html">Open Audio →</a> &nbsp; <a href="./video.html">Open Video →</a></p>'}).catch(()=>app.innerHTML='<h2>Player library could not be loaded.</h2><p class="note">Please check that <code>library.json</code> is present in the GitHub repository.</p>');
</script></body></html>
