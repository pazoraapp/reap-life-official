<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAP LIFE — Share</title><style>:root{--g:#245b45;--c:#f8f5ed;--m:#68766f;--line:#e5dfd3;--gold:#b89545}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#24352d;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 16px 60px}.top{display:flex;justify-content:space-between}.top a{color:var(--g);text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:900;color:var(--m)}h1{font-size:clamp(28px,7vw,44px);line-height:1.08;margin:8px 0;color:var(--g)}.scripture{font-size:18px;font-weight:800}.preview{margin-top:18px;padding:22px;border-radius:18px;background:linear-gradient(135deg,#f7f1e2,#fff);border:1px solid #e5dece}.preview .brand{font-weight:900;letter-spacing:.1em;color:var(--g)}.preview p{line-height:1.6}.buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.buttons button{border:1px solid #d9d2c5;border-radius:12px;padding:12px;background:#fff;color:var(--g);font-weight:850}.buttons .primary{background:var(--g);color:#fff}.copy{margin-top:14px;width:100%;padding:13px;border:0;border-radius:12px;background:#f0eee7;color:var(--g);font-weight:850}.hint{color:var(--m);font-size:13px;line-height:1.6}.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f7f5ef;color:var(--m);font-size:12px;display:none}</style></head><body><main class="wrap"><div class="top" style="align-items:center;gap:12px;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:10px"><img src="./reap-life-logo.png" alt="REAP LIFE logo" style="width:42px;height:42px;object-fit:contain"><div><strong style="color:#245b45;letter-spacing:.08em">REAP LIFE</strong><div style="font-size:11px;color:#68766f">CHRIST • WORD • LIFE</div></div></div><div style="display:flex;gap:12px;margin-left:auto"><a href="javascript:history.back()">← Back</a><a href="./index.html">REAP LIFE Home</a></div></div><div id="app" class="card">Loading…</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search), id=params.get('id');
fetch('./library.json').then(r=>r.json()).then(d=>{const x=d.content.find(a=>a.id===id)||d.content.find(a=>a.type==='Life Memo')||d.content[0]; if(!x){app.innerHTML='<h2>Nothing to share yet</h2>';return}
 const memo=x.type==='Life Memo'?x:d.content.find(a=>a.id===x.connectedLifeMemo); const title=memo?.title||x.title; const scripture=memo?.scripture||x.primaryScripture||''; const text=memo?.reflection||x.description||'Explore this message from REAP LIFE.'; const url=new URL(x.type==='Life Memo'?'./lifememo.html':'./message.html',location.href); if(x.type!=='Life Memo') url.searchParams.set('id',x.id); const shareUrl=url.href; const shareText=`${title}\n${scripture}\n\n${text.slice(0,180)}${text.length>180?'…':''}\n\nRead, listen and explore more on REAP LIFE.`;
 app.innerHTML=`<p class="eyebrow">REAP LIFE SHARE PACKAGE</p><h1>${esc(title)}</h1><p class="scripture">${esc(scripture)}</p><div class="preview"><div class="brand">REAP LIFE</div><p><b>${esc(title)}</b></p><p>${esc(scripture)}</p><p>${esc(text.slice(0,220))}${text.length>220?'…':''}</p><p class="hint">Read • Listen • Watch • Pray</p></div><div class="buttons"><button class="primary" onclick="nativeShare()">📤 Share to your apps</button><button onclick="whatsapp()">WhatsApp</button><button onclick="facebook()">Facebook</button><button onclick="telegram()">Telegram</button><button onclick="xshare">X</button><button onclick="copyAll()">Copy message</button></div><button class="copy" onclick="copyLink()">Copy REAP LIFE link</button><div id="status" class="status"></div><p class="hint">REAP LIFE prepares the message and link; each platform decides how its official sharing interface works. The shared link always points back to REAP LIFE.</p>`;
 window.shareUrl=shareUrl; window.shareText=shareText; window.shareTitle=title;
});
function show(s){const e=document.getElementById('status');e.textContent=s;e.style.display='block'}
function nativeShare(){if(navigator.share){navigator.share({title:shareTitle,text:shareText,url:shareUrl}).catch(()=>{})}else copyAll()}
function open(u){location.href=u}
function whatsapp(){open('https://wa.me/?text='+encodeURIComponent(shareText+'\n'+shareUrl))}
function facebook(){open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(shareUrl))}
function telegram(){open('https://t.me/share/url?url='+encodeURIComponent(shareUrl)+'&text='+encodeURIComponent(shareTitle+'\n'+shareText))}
function xshare(){open('https://twitter.com/intent/tweet?text='+encodeURIComponent(shareTitle+' — '+scripture)+'&url='+encodeURIComponent(shareUrl))}
function copyLink(){navigator.clipboard?.writeText(shareUrl).then(()=>show('REAP LIFE link copied.')).catch(()=>show(shareUrl))}
function copyAll(){navigator.clipboard?.writeText(shareText+'\n'+shareUrl).then(()=>show('Share text and link copied.')).catch(()=>show(shareText+' '+shareUrl))}
</script></body></html>
