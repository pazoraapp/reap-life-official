<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAP LIFE — Video</title><style>body{margin:0;background:#f8f5ed;color:#24352d;font-family:system-ui}.wrap{max-width:850px;margin:auto;padding:20px 16px}.card{background:#fff;border:1px solid #e5dfd3;border-radius:18px;padding:20px;margin-top:14px}a{color:#245b45}.note{color:#68766f;line-height:1.6}.frame{position:relative;padding-top:56.25%;margin-top:15px}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}video{width:100%;margin-top:15px}</style></head><body><main class="wrap"><a href="./index.html">← REAP LIFE</a><div id="app" class="card"><h1>🎥 Video</h1><p class="note">Loading video…</p></div></main><script>
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function youtube(u){const m=String(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);return m?'https://www.youtube.com/embed/'+m[1]:''}
fetch('./library.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('library');return r.json()}).then(d=>{const x=(d.content||[]).find(a=>a.id==='RL-0001');const u=x?.media?.videoUrl||'';const yt=youtube(u);const media=yt?'<div class="frame"><iframe src="'+esc(yt)+'" title="REAP LIFE video" allowfullscreen></iframe></div>':u?'<video controls preload="metadata" src="'+esc(u)+'"></video>':'<p class="note">The video page is working. No video recording has been attached to this message yet.</p>';app.innerHTML='<h1>🎥 Video</h1><h2>'+esc(x?.title||'REAP LIFE Message')+'</h2>'+media+'<p><a href="./message.html?id=RL-0001">Open the message →</a></p>'}).catch(()=>{app.innerHTML='<h2>Video library could not be loaded.</h2><p class="note">Please check that <code>library.json</code> is present in the GitHub repository, then refresh the page.</p>'});
</script></body></html>
