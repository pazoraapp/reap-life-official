<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07120e"><title>REAP LIFE — Audience Display</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07120e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;align-items:center;justify-content:center}.stage{width:100vw;min-height:100vh;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;background:#07120e}.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#07120e}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#000b);pointer-events:none}.copy{position:relative;z-index:2;max-width:92%;padding:5vw;text-shadow:0 3px 12px #000}.copy .brand{letter-spacing:4px;font-weight:900;font-size:clamp(12px,1.8vw,20px)}h1{font-size:clamp(34px,6vw,80px);margin:.3em 0}.text{font-size:clamp(20px,3vw,38px);line-height:1.45;white-space:pre-wrap}.hint{position:absolute;right:14px;bottom:12px;z-index:5;font-size:11px;color:#fff9;background:#0008;padding:6px 8px;border-radius:8px}.hidden{display:none}</style></head><body><main class="stage" id="stage"><div class="copy"><div class="brand">REAP LIFE</div><h1 id="title">Waiting for presentation</h1><div class="text" id="text">Open this display from the REAP LIFE Teaching & Presentation Studio.</div></div><div class="shade"></div><div class="hint">Audience Display</div><video id="video" class="hidden" controls playsinline></video><audio id="audio" class="hidden" controls></audio></main><script>const DB='reapLifeMediaDB',VER=1,STORE='media';let db,plan=[],current=-1,media=[];const $=id=>document.getElementById(id);function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}function allMedia(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}function findMedia(id){return media.find(m=>m.id===id)}function clear(){const v=$('video'),a=$('audio');v.pause();a.pause();v.classList.add('hidden');a.classList.add('hidden');v.removeAttribute('src');a.removeAttribute('src');const img=$('stage').querySelector('img');if(img)img.remove()}function show(i,repeat=false){if(!plan[i])return;current=i;clear();const p=plan[i],m=p.mediaId?findMedia(p.mediaId):null;$('title').textContent=p.title||'REAP LIFE';$('text').textContent=p.note||'';if(m){const u=URL.createObjectURL(m.blob);if(m.type==='image'){const img=document.createElement('img');img.src=u;img.alt=m.name;$('stage').insertBefore(img,$('stage').firstChild)}else if(m.type==='video'){const v=$('video');v.src=u;v.classList.remove('hidden');v.currentTime=0;v.play().catch(()=>{})}else if(m.type==='audio'){const a=$('audio');a.src=u;a.classList.remove('hidden');a.currentTime=0;a.play().catch(()=>{})}}}function listen(){try{const ch=new BroadcastChannel('reapLifePresentation');ch.onmessage=e=>{if(e.data&&e.data.type==='state'){plan=Array.isArray(e.data.plan)?e.data.plan:[];if(typeof e.data.current==='number')show(e.data.current)}}}catch(e){}}openDB().then(async()=>{media=await allMedia();try{const x=JSON.parse(localStorage.getItem('reapLifePresentationPlan')||'null');if(x)plan=x.plan||[]}catch(e){}listen()}).catch(()=>{$('text').textContent='Unable to open the REAP LIFE media library in this browser.'});if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});</script></body></html>
