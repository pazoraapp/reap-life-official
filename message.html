<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAP LIFE — Message</title><style>:root{--g:#245b45;--c:#f8f5ed;--m:#68766f;--line:#e5dfd3;--gold:#b89545}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#24352d;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.back,a{color:var(--g);text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:14px}.eyebrow{color:var(--m);font-size:12px;font-weight:800;letter-spacing:.08em}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf4ef;color:var(--g);font-size:11px;font-weight:800}.hero h1{font-size:clamp(28px,7vw,46px);line-height:1.08;margin:9px 0}.meta{color:var(--m);line-height:1.7}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}.tabs button{border:1px solid #d9d2c5;background:#f5f2eb;color:var(--g);padding:10px 13px;border-radius:10px;font-weight:800}.tabs button.active{background:var(--g);color:#fff}.pane{display:none;margin-top:18px}.pane.active{display:block}.experience{border-top:1px solid var(--line);padding-top:18px}.cta{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.cta a{background:#f0eee7;padding:10px 12px;border-radius:10px;font-weight:800}.cta a.primary{background:var(--g);color:#fff}.media{margin-top:14px}.media audio,.media video{width:100%}.embed{position:relative;padding-top:56.25%;overflow:hidden;border-radius:14px;background:#111}.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.note{padding:12px;border-radius:12px;background:#faf8f2;border:1px solid var(--line);color:var(--m);font-size:13px}.memo-title{font-size:24px}.prayer{font-size:17px;line-height:1.8}.share{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.share button{border:0;border-radius:10px;padding:10px 12px;background:var(--g);color:#fff;font-weight:800}@media(max-width:600px){.card{padding:18px}.top{align-items:flex-start}.hero h1{font-size:31px}}</style></head><body><main class="wrap"><div class="top" style="align-items:center;gap:12px;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:10px"><img src="./reap-life-logo.png" alt="REAP LIFE logo" style="width:42px;height:42px;object-fit:contain"><div><strong style="color:#245b45;letter-spacing:.08em">REAP LIFE</strong><div style="font-size:11px;color:#68766f">CHRIST • WORD • LIFE</div></div></div><div style="display:flex;gap:12px;margin-left:auto"><a class="back" href="./word.html">← Word</a><a href="./index.html">REAP LIFE Home</a></div></div><div id="app" class="card">Loading…</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id');
const mediaUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
function youtube(u){if(!u)return null;let m=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);return m?`https://www.youtube.com/embed/${m[1]}`:null}
fetch('./library.json').then(r=>r.json()).then(d=>{const x=d.content.find(a=>a.id===id);if(!x){app.innerHTML='<h2>Message not found</h2>';return}const memo=d.content.find(a=>a.id===x.connectedLifeMemo);const prayer=d.content.find(a=>a.id===x.connectedPrayer);const m=x.media||{};const audio=mediaUrl(m.audioUrl);const video=mediaUrl(m.videoUrl);const short=mediaUrl(m.shortVideoUrl);const yt=youtube(m.videoUrl||'');app.innerHTML=`<section class="hero"><span class="pill">${esc(x.status||'Draft')}</span><p class="eyebrow">REAP LIFE WORD</p><h1>${esc(x.title)}</h1><p class="meta"><b>Topic:</b> ${esc(x.topic||'')}<br><b>Speaker:</b> ${esc(x.speaker||'')}<br><b>Primary Scripture:</b> ${esc(x.primaryScripture||'')}<br><b>Supporting:</b> ${esc((x.supportingScriptures||[]).join('; ')||'—')}</p><div class="tabs"><button class="active" data-tab="read">Read</button><button data-tab="listen">Listen</button><button data-tab="watch">Watch</button><button data-tab="pray">Pray</button><button data-tab="memo">Life Memo</button></div></section><section id="read" class="pane active"><div class="experience"><h2>Message</h2><p>${esc(x.description||'The full message will appear here when the ministry content is entered.')}</p><div class="note">This master message is connected to its other ministry experiences so one approved message can serve multiple formats.</div></div></section><section id="listen" class="pane"><div class="experience"><h2>Hear the message</h2>${audio?`<div class="media"><audio controls preload="metadata" src="${esc(audio)}"></audio></div>`:'<div class="note">Audio is not yet attached to this message. Add an audio URL in the Content Entry desk.</div>'}<div class="cta"><a href="./prayer.html?id=${encodeURIComponent(prayer?.id||'')}">Go to Prayer</a></div></div></section><section id="watch" class="pane"><div class="experience"><h2>Watch</h2>${yt?`<div class="media embed"><iframe src="${esc(yt)}" title="REAP LIFE video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`:video?`<div class="media"><video controls preload="metadata" src="${esc(video)}"></video></div>`:'<div class="note">Full video is not yet attached. Add a YouTube or video URL in the Content Entry desk.</div>'}${short?`<p class="meta">Short video: <a href="${esc(short)}" target="_blank" rel="noopener">Open short video</a></p>`:''}</div></section><section id="pray" class="pane"><div class="experience"><h2>${esc(prayer?.title||'Prayer')}</h2><p class="prayer">${esc(prayer?.text||'The connected prayer has not yet been entered.')}</p><div class="cta"><a class="primary" href="./prayer.html?id=${encodeURIComponent(prayer?.id||'')}">Open Prayer</a></div></div></section><section id="memo" class="pane"><div class="experience"><p class="eyebrow">LIFE MEMO</p><h2 class="memo-title">${esc(memo?.title||'Connected Life Memo')}</h2><p class="meta"><b>Scripture:</b> ${esc(memo?.scripture||x.primaryScripture||'')}</p><div class="cta"><a class="primary" href="./lifememo.html">Open Life Memo</a></div></div></section><div class="share"><a href="./share.html?id=${encodeURIComponent(id)}" style="display:inline-block;background:var(--g);color:#fff;padding:10px 12px;border-radius:10px;font-weight:800;text-decoration:none">Share this message</a></div>`;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')})});
function shareIt(){if(navigator.share){navigator.share({title:document.title,url:location.href}).catch(()=>{})}else{navigator.clipboard?.writeText(location.href);alert('Message link copied.')}}
</script></body></html>
