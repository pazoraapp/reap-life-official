<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAP LIFE — Share Studio</title><style>
:root{--g:#245b45;--gold:#b89545;--c:#f8f5ed;--ink:#24352d;--m:#68766f;--line:#e4ded1;--blue:#315477}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:3}.bar{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;letter-spacing:.1em;color:var(--g)}.wrap{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:310px 1fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px}.item{padding:11px;border:1px solid var(--line);border-radius:12px;margin:7px 0;cursor:pointer}.item.active{border:2px solid var(--g)}.item b{display:block}.muted{color:var(--m);font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,textarea,select{width:100%;padding:10px;border:1px solid #d8d2c6;border-radius:10px;background:#fff;font:inherit}textarea{min-height:95px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:850;background:var(--g);color:#fff;cursor:pointer;text-decoration:none}.alt{background:#fff;color:var(--g);border:1px solid var(--g)}.blue{background:var(--blue)}.gold{background:#76551e}.formats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.fmt{padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;font-weight:800}.fmt.active{background:var(--g);color:#fff}.stage{display:flex;justify-content:center;padding:15px;background:#eee9de;border-radius:18px}.poster{width:min(100%,390px);aspect-ratio:9/16;border-radius:20px;overflow:hidden;position:relative;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,#e9e0ca,#fbfaf5 55%,#cdd9cf)}.poster:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 18%,rgba(255,255,255,.85),transparent 28%),linear-gradient(0deg,rgba(20,40,30,.62),transparent 58%)}.poster>*{position:relative}.plogo{font-size:13px;font-weight:950;letter-spacing:.16em;margin-bottom:auto}.ptitle{font-size:clamp(27px,7vw,42px);line-height:1.03;font-weight:950;color:#fff;text-shadow:0 2px 9px rgba(0,0,0,.3)}.pscripture{margin-top:12px;font-weight:850;color:#fff}.pbody{margin-top:13px;color:#fff;line-height:1.45;font-size:14px}.footer{margin-top:15px;font-size:10px;letter-spacing:.08em;color:#fff;font-weight:900}.note{padding:11px;border-radius:11px;background:#f1f6fb;border:1px solid #c8d7e7;margin-top:10px;font-size:12px;line-height:1.5}.warn{padding:11px;border-radius:11px;background:#fff8df;border:1px solid #eadcae;margin-top:10px;font-size:12px}.previewAudio,.previewVideo{width:100%;margin-top:12px;border-radius:12px}.sharegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.sharegrid button{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:850;color:var(--g)}@media(max-width:820px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.formats{grid-template-columns:repeat(2,1fr)}}
</style><script src="./reap-readability.js"></script></head><body><header class="top"><div class="bar"><div><div class="brand">REAP LIFE</div><small>Share Studio</small></div><div class="actions"><a class="btn alt" href="./content-entry.html">Content Control</a><a class="btn alt" href="./convert.html">Convert</a><a class="btn alt" href="./share-rules.html">Duration Rules</a></div></div></header><main class="wrap"><div class="grid"><section class="card"><input id="q" placeholder="Find content…" oninput="renderList()"><div id="list"></div></section><section><div class="card" id="editor">Choose content to prepare a share.</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./assets/reap-config.js"></script><script src="./assets/reap-supabase.js"></script><script>
(async()=>{await REAP_AUTH.requireRole(["admin", "editor", "presenter"])})();

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=JSON.parse(localStorage.getItem('reapLifeLibrary')||'null')||{messages:[]};data.messages=data.messages||[];let selected=-1,format='status';const paramId=new URLSearchParams(location.search).get('id');
function save(){localStorage.setItem('reapLifeLibrary',JSON.stringify(data))}
function renderList(){let q=(document.getElementById('q').value||'').toLowerCase();let arr=data.messages.map((m,i)=>({m,i})).filter(x=>!q||JSON.stringify(x.m).toLowerCase().includes(q));document.getElementById('list').innerHTML=arr.map(x=>`<div class="item ${x.i===selected?'active':''}" onclick="pick(${x.i})"><b>${esc(x.m.title||'Untitled')}</b><span class="muted">${esc(x.m.id)} · ${esc(x.m.type||'Content')}</span></div>`).join('')||'<p class="muted">No content in this browser yet. Import your library in Content Control.</p>'}
function pick(i){selected=i;renderList();renderEditor()}function text(){let m=data.messages[selected]||{};return m.text||m.body||m.description||''}function title(){return (data.messages[selected]||{}).title||'REAP LIFE'}function scripture(){let m=data.messages[selected]||{};return m.scripture||m.primaryScripture||''}
function renderEditor(){if(selected<0){if(paramId){let i=data.messages.findIndex(m=>m.id===paramId);if(i>=0){pick(i);return}}document.getElementById('editor').innerHTML='<p class="muted">Choose content from the left.</p>';return}let m=data.messages[selected];document.getElementById('editor').innerHTML=`<div class="row"><div><b>${esc(title())}</b><div class="muted">${esc(m.id)} · ${esc(m.type||'Content')}</div></div><div><label>Share format</label><select id="fmt" onchange="format=this.value;renderEditor()"><option value="status">WhatsApp/Facebook/Instagram Story</option><option value="post">Facebook/WhatsApp Post</option><option value="short">Short video / Reel / Short</option><option value="full">Full video / audio</option></select></div></div><div class="formats"><button class="fmt ${format==='status'?'active':''}" onclick="format='status';renderEditor()">9:16 Status</button><button class="fmt ${format==='post'?'active':''}" onclick="format='post';renderEditor()">1:1 / Post</button><button class="fmt ${format==='short'?'active':''}" onclick="format='short';renderEditor()">Short Video</button><button class="fmt ${format==='full'?'active':''}" onclick="format='full';renderEditor()">Full Media</button></div><div class="stage"><div class="poster" id="poster"><div class="plogo">REAP LIFE</div><div class="ptitle">${esc(title())}</div><div class="pscripture">${esc(scripture())}</div><div class="pbody">${esc(text().slice(0,420))}${text().length>420?'…':''}</div><div class="footer">WORD OF GOD • LIFE • FAITH • CHRIST</div></div></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="downloadPoster()">Download share image</button><button class="btn blue" onclick="copyCaption()">Copy caption</button><button class="btn gold" onclick="nativeShare()">Share to apps</button></div>${m.mediaUrl||m.audioUrl||m.videoUrl||m.shortVideoUrl?`<div class="note"><b>Attached media found.</b>${m.mediaUrl?`<div>Media: ${esc(m.mediaUrl)}</div>`:''}${m.audioUrl?`<audio class="previewAudio" controls src="${esc(m.audioUrl)}"></audio>`:''}${m.videoUrl?`<video class="previewVideo" controls playsinline src="${esc(m.videoUrl)}"></video>`:''}${m.shortVideoUrl?`<video class="previewVideo" controls playsinline src="${esc(m.shortVideoUrl)}"></video>`:''}</div>`:'<div class="note"><b>No media attached yet.</b> The share design is ready. Attach the actual audio/video in the editor before sharing the media version.</div>'}<div class="card" style="margin-top:12px;padding:13px;background:#fbfaf5"><b>Single-post duration check</b><div class="row" style="margin-top:8px"><div><label>Post to</label><select id="platform" onchange="durationCheck()"></select></div><div><label>Planned duration (seconds)</label><input id="plannedSec" type="number" min="0" value="30" oninput="durationCheck()"></div></div><div id="durationStatus" class="note"></div><div class="actions" style="margin-top:8px"><button class="btn" onclick="openRules()">Rules & Duration Settings</button><button class="btn alt" onclick="copyPlan()">Copy duration plan</button></div></div><div class="sharegrid"><button onclick="whatsapp()">WhatsApp</button><button onclick="facebook()">Facebook</button><button onclick="copyCaption()">Copy text</button><button onclick="downloadPoster()">Save image</button></div><div class="warn"><b>Platform reality:</b> WhatsApp/Facebook control whether a shared item opens or plays inside their own Status/Story interface. REAP LIFE cannot override those platform rules. Where direct media sharing is supported, this studio uses the device share sheet and the actual file/URL; otherwise it gives you a ready-to-upload image/video and caption.</div>`};const poster=document.getElementById('poster');if(poster&&m.imageUrl){poster.style.backgroundImage=`url(${JSON.stringify(m.imageUrl)})`;poster.style.backgroundSize='cover';poster.style.backgroundPosition='center';REAPReadability.auto(poster,m.imageUrl,'Auto')}

const shareDefaults={"WhatsApp Status":60,"Facebook Story":60,"Instagram Story":60,"Facebook/Reel":180,"Instagram Reel":180,"YouTube Short":180,"WhatsApp Chat":600,"Facebook Post":600};
function getRules(){return JSON.parse(localStorage.getItem('reapLifeShareRules')||'null')||Object.fromEntries(Object.entries(shareDefaults).map(([k,v])=>[k,{max:v,recommended:Math.min(v,45)}]));}
function durationSecondsFromText(){let s=text().trim();if(!s)return 0;let words=s.split(/\s+/).filter(Boolean).length;let prefs=JSON.parse(localStorage.getItem('reapLifeSharePrefs')||'null')||{wpm:130};return Math.ceil(words/(Number(prefs.wpm)||130)*60)}
function durationCheck(){let rules=getRules(),sel=document.getElementById('platform'),out=document.getElementById('durationStatus');if(!sel||!out)return;let r=rules[sel.value];let sec=Math.max(0,Number(document.getElementById('plannedSec').value)||durationSecondsFromText());if(!sec){out.innerHTML='Enter a planned duration.';return}if(sec<=r.max){out.className='ok';out.innerHTML=`<b>READY — ONE POST</b><br>${sec}s planned · ${r.max}s maximum · ${r.recommended}s recommended.`}else{let over=sec-r.max;let prefs=JSON.parse(localStorage.getItem('reapLifeSharePrefs')||'null')||{single:true,segment:false,wpm:130};let target=Math.floor(r.max/60*(Number(prefs.wpm)||130));out.className='bad';out.innerHTML=`<b>TOO LONG FOR ONE POST</b><br>${sec}s planned · ${r.max}s maximum · ${over}s over.<br>Try about ${target} spoken words, edit manually, or ${prefs.segment?'allow segmentation.':'turn on segmentation in Duration Rules if you want parts.'}`}}
function openRules(){location.href='./share-rules.html'}
function copyPlan(){let sel=document.getElementById('platform'),r=getRules()[sel.value],sec=Number(document.getElementById('plannedSec').value)||durationSecondsFromText();navigator.clipboard?.writeText(`${sel.value}
Planned: ${sec}s
Maximum: ${r.max}s
Recommended: ${r.recommended}s`).then(()=>alert('Duration plan copied.')).catch(()=>alert(`${sel.value}: ${sec}s planned / ${r.max}s maximum.`))}
function initDuration(){let sel=document.getElementById('platform');if(!sel)return;let rules=getRules();sel.innerHTML=Object.keys(rules).map(k=>`<option>${esc(k)}</option>`).join('');let est=durationSecondsFromText();if(est)document.getElementById('plannedSec').value=est;durationCheck()}
function caption(){return `${title()}
${scripture()}

${text().slice(0,500)}

— REAP LIFE`}
function copyCaption(){navigator.clipboard?.writeText(caption()).then(()=>alert('Caption copied.')).catch(()=>alert(caption()))}
function whatsapp(){location.href='https://wa.me/?text='+encodeURIComponent(caption())}
function facebook(){location.href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href)}
function nativeShare(){let m=data.messages[selected]||{};if(navigator.share){navigator.share({title:title(),text:caption(),url:location.href}).catch(()=>{})}else copyCaption()}
async function downloadPoster(){let p=document.getElementById('poster');let m=selected>=0?data.messages[selected]:null;let c=document.createElement('canvas');let w=1080,h=1920;if(format==='post'){w=h=1080}c.width=w;c.height=h;let ctx=c.getContext('2d');let img=null;if(m&&m.imageUrl){img=new Image();img.crossOrigin='anonymous';try{img.src=m.imageUrl;await new Promise((r,j)=>{img.onload=r;img.onerror=j})}catch(e){img=null}}if(img&&img.naturalWidth){const r=Math.max(w/img.naturalWidth,h/img.naturalHeight),iw=img.naturalWidth*r,ih=img.naturalHeight*r;ctx.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih);const tone=p.dataset.readability==='dark';const ov=ctx.createLinearGradient(0,h*.35,0,h);ov.addColorStop(0,tone?'rgba(255,255,255,.02)':'rgba(0,0,0,.04)');ov.addColorStop(1,tone?'rgba(255,255,255,.76)':'rgba(0,0,0,.72)');ctx.fillStyle=ov;ctx.fillRect(0,h*.35,w,h*.65)}else{let grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#e9e0ca');grad.addColorStop(.55,'#fbfaf5');grad.addColorStop(1,'#cdd9cf');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.fillStyle='rgba(20,40,30,.58)';ctx.fillRect(0,h*.48,w,h*.52)}const tone=p.dataset.readability==='dark';ctx.fillStyle=tone?'#18231e':'#fff';ctx.textAlign='left';ctx.shadowColor=tone?'rgba(255,255,255,.45)':'rgba(0,0,0,.72)';ctx.shadowBlur=5;ctx.font=`900 ${Math.round(w*.035)}px Arial`;ctx.fillText('REAP LIFE',w*.08,h*.09);let max=w*.82;let y=h*.57;ctx.font=`900 ${Math.round(w*.075)}px Arial`;y=wrap(ctx,title(),w*.08,y,max,Math.round(w*.075)*1.05);ctx.font=`800 ${Math.round(w*.035)}px Arial`;y+=25;y=wrap(ctx,scripture(),w*.08,y,max,Math.round(w*.035)*1.35);ctx.font=`400 ${Math.round(w*.027)}px Arial`;y+=25;wrap(ctx,text().slice(0,420),w*.08,y,max,Math.round(w*.027)*1.5);ctx.shadowBlur=0;ctx.font=`900 ${Math.round(w*.022)}px Arial`;ctx.fillText('WORD OF GOD • LIFE • FAITH • CHRIST',w*.08,h*.94);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='reap-life-share.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')}

function wrap(ctx,s,x,y,max,lh){let words=String(s).split(/\s+/),line='';for(let word of words){let test=line?line+' '+word:word;if(ctx.measureText(test).width>max&&line){ctx.fillText(line,x,y);y+=lh;line=word}else line=test}if(line){ctx.fillText(line,x,y);y+=lh}return y}
renderList();renderEditor();initDuration();
</script></body></html>
