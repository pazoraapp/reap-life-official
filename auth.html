<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20252a"><link rel="stylesheet" href="./assets/reap-v2.css"><title>REAP LIFE — Ministry Sign In</title></head><body><main class="section"><div class="shell" style="max-width:560px"><div class="panel" style="padding:34px"><div style="text-align:center"><img src="./reap-life-logo.png" style="width:88px;height:88px;object-fit:contain"><div class="eyebrow" style="color:var(--gold);margin-top:10px">PRIVATE MINISTRY ACCESS</div><h1 style="font-size:42px">Sign in to REAP LIFE</h1><p class="muted">This area is protected by authenticated access. Public visitors do not enter the Ministry Studio through this page.</p></div><div id="setup" class="status hidden"></div><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn btn-dark" style="width:100%" type="submit">Sign in</button></form><div class="actions"><button class="btn btn-outline" id="reset" type="button">Forgot password?</button><a class="btn btn-outline" href="./index.html">Public REAP LIFE</a></div><div id="msg" class="status" style="margin-top:16px"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./assets/reap-config.js"></script><script src="./assets/reap-supabase.js"></script><script>
const $=id=>document.getElementById(id),msg=$('msg'),setup=$('setup');
function show(t,kind=''){msg.textContent=t;msg.style.background=kind==='error'?'#f2dddd':'var(--gold2)'}
if(!REAP_AUTH.configured()){setup.classList.remove('hidden');setup.textContent='Cloud authentication is not connected yet. Create the Supabase project, run the supplied SQL schema, then add the project URL and publishable key to assets/reap-config.js.'}
$('form').onsubmit=async e=>{e.preventDefault();if(!REAP_AUTH.configured())return show('Connect Supabase first.','error');show('Signing in…');try{const r=await REAP_AUTH.signIn($('email').value.trim(),$('password').value);if(r.error)throw r.error;location.href='./studio.html'}catch(err){show(err.message||'Unable to sign in.','error')}};
$('reset').onclick=async()=>{if(!REAP_AUTH.configured())return show('Connect Supabase first.','error');const email=$('email').value.trim();if(!email)return show('Enter your email first.','error');try{const r=await REAP_AUTH.reset(email,location.origin+location.pathname.replace(/\/[^/]*$/,'/')+'auth.html');if(r.error)throw r.error;show('Password-reset instructions sent if the account is eligible.')}catch(err){show(err.message||'Unable to send reset email.','error')}};
</script></body></html>
