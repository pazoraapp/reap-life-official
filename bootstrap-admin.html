<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20252a"><link rel="stylesheet" href="./assets/reap-v2.css"><title>REAP LIFE — First Admin</title></head><body><main class="section"><div class="shell" style="max-width:620px"><div class="panel" style="padding:30px"><div class="eyebrow" style="color:var(--gold)">FIRST MINISTRY ADMIN</div><h1>Activate your REAP LIFE admin account.</h1><p class="muted">Use this once, after creating your first Supabase Authentication user. The database function will refuse to create a second administrator.</p><div id="status" class="status">Checking connection…</div><div class="actions"><button class="btn btn-dark" id="activate" type="button">Make me the first admin</button><a class="btn btn-outline" href="./auth.html">Ministry Sign In</a></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./assets/reap-config.js"></script><script src="./assets/reap-supabase.js"></script><script>(async()=>{const s=document.getElementById('status'),b=document.getElementById('activate');if(!REAP_AUTH.configured()){s.textContent='Supabase is not connected yet. Add the publishable key to assets/reap-config.js.';b.disabled=true;return}try{const u=await REAP_AUTH.user();if(!u){s.textContent='Sign in first, then return to this page.';return}s.textContent='Signed in as '+(u.email||u.id)+'. You can activate the first administrator.'}catch(e){s.textContent=e.message||'Unable to check your account.'}b.onclick=async()=>{b.disabled=true;s.textContent='Activating…';try{const c=REAP_AUTH.client();const r=await c.rpc('bootstrap_first_admin');if(r.error)throw r.error;s.textContent='Success. Your account is now the REAP LIFE administrator.';setTimeout(()=>location.href='./studio.html',800)}catch(e){s.textContent=e.message||'Unable to activate administrator.';b.disabled=false}}})();</script></body></htm
