<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAP LIFE — Word</title><style>:root{--g:#245b45;--c:#f8f5ed;--m:#68766f}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#24352d;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:#fff;padding:16px;border-bottom:1px solid #e5dfd3}.wrap{max-width:850px;margin:auto}a{color:var(--g)}main{padding:20px 16px 40px}.eyebrow{color:var(--m);font-size:12px;font-weight:700;letter-spacing:.08em}.card{background:#fff;border:1px solid #e5dfd3;border-radius:18px;padding:20px;margin:14px 0}.tag{display:inline-block;background:#edf4ef;color:var(--g);padding:5px 9px;border-radius:99px;font-size:11px;font-weight:700}.btn{display:inline-block;background:var(--g);color:#fff;text-decoration:none;padding:11px 14px;border-radius:11px;margin-top:8px}</style><link rel="stylesheet" href="./assets/reap-v3.css">
</head><body><header><div class="wrap"><a href="./index.html">← REAP LIFE</a></div></header><main class="wrap"><p class="eyebrow">REAP LIFE WORD</p><h1>Messages from the Word of God</h1><div id="list">Loading…</div></main><script>fetch('./library.json').then(r=>r.json()).then(d=>{const items=d.content.filter(x=>x.type==='message');document.getElementById('list').innerHTML=items.map(x=>`<article class="card"><span class="tag">${x.status.toUpperCase()}</span><h2>${x.title}</h2><p><b>Topic:</b> ${x.topic}</p><p><b>Scripture:</b> ${x.primaryScripture}</p><p><b>Speaker:</b> ${x.speaker}</p><a class="btn" href="./message.html?id=${encodeURIComponent(x.id)}">Open message →</a></article>`).join('')})</script><script src="./assets/reap-v3-shell.js"></script>
</body></html>
